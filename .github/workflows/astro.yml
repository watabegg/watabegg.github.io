name: Verify public site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-public-site-${{ github.ref }}
  cancel-in-progress: true

env:
  IDENTITY_SOURCE: example

jobs:
  verify:
    name: Type, build and privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Astro dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Slidev dependencies
        run: pnpm --dir slide install --frozen-lockfile

      - name: Type check
        run: pnpm ts

      - name: Astro check
        run: pnpm exec astro check

      - name: Biome check
        run: pnpm exec biome check .

      - name: Build public site with example identity
        run: pnpm build:example

      - name: Verify public output privacy
        run: pnpm verify:public
